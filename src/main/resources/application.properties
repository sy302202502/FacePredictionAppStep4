# =======================
# データベース設定（環境変数優先 → ローカル開発デフォルト）
# =======================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/faceapp}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgrestest}
spring.datasource.driver-class-name=org.postgresql.Driver

# =======================
# JPA / Hibernate 設定
# =======================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# タイムゾーン（Supabase=UTC でも JST として日付を扱う）
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Tokyo

# =======================
# ファイルアップロード設定
# =======================
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# アップロード先ディレクトリ（Docker: /data/uploads, ローカル: ~/faceapp/uploads）
upload.dir=${UPLOAD_DIR:${user.home}/faceapp/uploads}

# Python スクリプトのディレクトリ
python.script.dir=${PYTHON_SCRIPT_DIR:${user.home}/git/FacePredictionAppStep4/python}

# =======================
# Thymeleaf テンプレート設定
# =======================
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# =======================
# サーバー設定
# =======================
server.port=${APP_PORT:8081}

# =======================
# Actuator 設定
# =======================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# =======================
# Spring Security 設定（Basic認証）
# APP_USERNAME / APP_PASSWORD を環境変数で必ず設定すること
# =======================
app.username=${APP_USERNAME:admin}
app.password=${APP_PASSWORD:FacePred2026}

# =======================
# ログ設定
# =======================
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.faceprediction=${LOG_LEVEL_APP:DEBUG}
logging.file.name=${LOG_FILE:logs/faceprediction.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
