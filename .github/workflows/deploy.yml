name: Build & Deploy

on:
  push:
    branches: [master, main]
    paths-ignore:
      - '**.md'
      - 'logs/**'
      - 'deploy/backup.sh'

jobs:
  # ── ジョブ1: ビルド & イメージPush（常に実行） ──────────────
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    steps:
      # 1. チェックアウト
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java ビルド
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        run: mvn package -DskipTests -q

      # 3. Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Java image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.java
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/app:latest
            ghcr.io/${{ github.repository }}/app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Build and push Python image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.python
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/python:latest
            ghcr.io/${{ github.repository }}/python:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # ── ジョブ2: OCI VMへデプロイ（OCI_HOSTが設定済みの場合のみ） ──
  deploy:
    name: Deploy to OCI VM
    needs: build
    runs-on: ubuntu-latest
    # OCI_HOSTシークレットが未設定の場合はスキップ
    if: ${{ secrets.OCI_HOST != '' }}

    steps:
      - name: Deploy to OCI VM
        uses: appleboy/ssh-action@v1
        with:
          host:        ${{ secrets.OCI_HOST }}
          username:    ${{ secrets.OCI_USER }}
          key:         ${{ secrets.OCI_SSH_KEY }}
          script: |
            set -e
            cd /opt/faceprediction

            # 最新イメージを取得
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker pull ghcr.io/${{ github.repository }}/app:latest
            docker pull ghcr.io/${{ github.repository }}/python:latest

            # 最新コードを取得
            git pull origin ${{ github.ref_name }}

            # ゼロダウンタイム再起動
            docker compose up -d --no-deps app python

            # ヘルスチェック（最大60秒待機）
            for i in $(seq 1 12); do
              if curl -sf http://localhost:8081/actuator/health > /dev/null 2>&1; then
                echo "✅ ヘルスチェック OK"
                break
              fi
              echo "  待機中... ($i/12)"
              sleep 5
            done

            # 古いイメージを削除
            docker image prune -f

            echo "✅ デプロイ完了: $(date '+%Y-%m-%d %H:%M:%S')"
