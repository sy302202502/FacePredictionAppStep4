# =======================
# データベース設定（環境変数優先 → ローカル開発デフォルト）
# =======================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/faceapp}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgrestest}
spring.datasource.driver-class-name=org.postgresql.Driver

# =======================
# JPA / Hibernate 設定
# =======================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# =======================
# ファイルアップロード設定
# =======================
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# アップロード先ディレクトリ（Docker: /data/uploads, ローカル: ~/faceapp/uploads）
upload.dir=${UPLOAD_DIR:${user.home}/faceapp/uploads}

# Python スクリプトのディレクトリ
python.script.dir=${PYTHON_SCRIPT_DIR:${user.home}/git/FacePredictionAppStep4/python}

# =======================
# Thymeleaf テンプレート設定
# =======================
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# =======================
# サーバー設定
# =======================
server.port=${APP_PORT:8081}
